name: Craft targeted Web startup
on:
  push:
    branches: [deploy/recovery-photo-check-20261030]
    paths: [.github/workflows/recovery-startup.yml, deployment/startup.cjs]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [photocraft]
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Wait for this compiled artifact
        run: |
          run_id=41010329398
          if [ "$APP" = photocraft ]; then run_id=41010784330; fi
          artifact_id=
          for attempt in $(seq 1 150); do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$APP-latest-chinese-20261030\" and .expired == false) | .id")
            if [ -n "$artifact_id" ]; then break; fi
            sleep 20
          done
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > artifact.zip
          unzip -q artifact.zip -d artifact
          inner=$(find artifact -name "$APP-web-*-zh.zip" -print -quit)
          test -n "$inner"
          mkdir site
          unzip -q "$inner" -d site
      - name: Supply the approved Chinese text font catalog
        run: |
          mkdir -p site/fonts
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/aosp-mirror/platform_frameworks_base/1aed5ea2dcf7cb0bf35635f378b2326461ba0df0/data/fonts/DroidSansFallbackFull.ttf -o site/fonts/DroidSansFallbackFull.ttf
          cp site/NOTICE-DroidSansFallback.txt site/fonts/NOTICE-DroidSansFallback.txt
          family=$(fc-scan --format '%{family}' site/fonts/DroidSansFallbackFull.ttf)
          style=$(fc-scan --format '%{style}' site/fonts/DroidSansFallbackFull.ttf)
          printf '%s | %s | fonts/DroidSansFallbackFull.ttf | Hans,Hant,Latn | Apache-2.0 | fonts/NOTICE-DroidSansFallback.txt\n' "$family" "$style" > site/fonts/manifest.txt
      - name: Prepare browser
        run: |
          npm install --no-audit --no-fund playwright-core@1.56.1
          command -v google-chrome
      - name: Open the Chinese Web startup page
        run: |
          python3 -m http.server 8765 --directory site >/tmp/site-server.log 2>&1 &
          node deployment/startup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-startup-20261030
          path: |
            startup.png
            startup.json
          retention-days: 14

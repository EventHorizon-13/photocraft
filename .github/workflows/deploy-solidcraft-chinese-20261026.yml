name: SolidCraft Web Chinese glyph fallback 20261026
on:
  push:
    branches: [deploy/web-upgrade-20261026]
    paths: [.github/workflows/deploy-solidcraft-chinese-20261026.yml]
permissions:
  contents: read
concurrency:
  group: deployment-solidcraft-chinese-20261026
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: local
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tangency-labs/solidcraft
          ref: 7770f8982de8bf00cabfe421b7f563b34c7af90f
          path: upstream
          persist-credentials: false
      - name: Fetch pinned Chinese font input
        run: |
          mkdir -p local-font-input
          curl --fail --location --retry 3 https://raw.githubusercontent.com/aosp-mirror/platform_frameworks_base/1aed5ea2dcf7cb0bf35635f378b2326461ba0df0/data/fonts/DroidSansFallbackFull.ttf -o local-font-input/DroidSansFallbackFull.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/aosp-mirror/platform_frameworks_base/1aed5ea2dcf7cb0bf35635f378b2326461ba0df0/data/fonts/NOTICE -o local-font-input/NOTICE
          echo '97320619b0f1ce4a7cda74cf064a0ce44ef3091287bc42755597e177cccf94c2  local-font-input/DroidSansFallbackFull.ttf' | sha256sum -c -
          echo '38751245389e1e23f73e6f5384b5cbe7fa972cc4410c5adc9c04b082a0b9561a  local-font-input/NOTICE' | sha256sum -c -
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev clang cmake
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          curl --fail --location --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz -o /tmp/trunk.tar.gz
          echo 'f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2  /tmp/trunk.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin" trunk
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: upstream
          key: deployment-solidcraft-chinese-20261026
      - name: Apply Chinese fallback patch
        run: |
          python3 local/deployment/patch-solidcraft-chinese-20261026.py upstream
          mkdir -p artifacts
          cd upstream
          git add -N .
          git diff --binary > ../artifacts/source.patch
          printf 'Upstream: tangency-labs/solidcraft\nTag: v0.23.0\nUpstream tag commit: 7770f8982de8bf00cabfe421b7f563b34c7af90f\nBuild commit: %s\n' "$GITHUB_SHA" > ../artifacts/SOURCE.txt
      - name: Compile Web
        working-directory: upstream/apps/solidcraft-web
        run: trunk build --release --locked
      - name: Package site
        run: |
          cp local-font-input/DroidSansFallbackFull.ttf upstream/dist/web/fonts/DroidSansFallbackFull.ttf
          cp local-font-input/NOTICE upstream/dist/web/NOTICE-DroidSansFallback.txt
          cat > upstream/dist/web/font-source.json <<'JSON'
          {"name":"DroidSansFallbackFull.ttf","source":"https://raw.githubusercontent.com/aosp-mirror/platform_frameworks_base/1aed5ea2dcf7cb0bf35635f378b2326461ba0df0/data/fonts/DroidSansFallbackFull.ttf","source_commit":"1aed5ea2dcf7cb0bf35635f378b2326461ba0df0","license":"Apache-2.0","sha256":"97320619b0f1ce4a7cda74cf064a0ce44ef3091287bc42755597e177cccf94c2"}
          JSON
          cd upstream
          cargo xtask web-offline
          cd dist/web
          zip -qr9 ../../../artifacts/solidcraft-web-0.23.0-zh.zip .
          cd ../../../artifacts
          sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-web-0.23.0-chinese-20261026
          path: artifacts/
          retention-days: 30

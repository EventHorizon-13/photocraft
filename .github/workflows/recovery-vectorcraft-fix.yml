name: VectorCraft font readiness repair
on:
  push:
    branches: [deploy/recovery-latest-20261030]
    paths: [deployment/**, .github/workflows/recovery-vectorcraft-fix.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vectorcraft-font-readiness-20261030
  cancel-in-progress: true
jobs:
  web:
    name: ${{ matrix.app }} ${{ matrix.tag }} Chinese Web
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - app: vectorcraft
            repo: storytold/vectorcraft
            tag: v0.18.0
            ref: 68b68a30acad9b3d8a72802b35f43b82e2bd7d3a
            donor: EventHorizon-13/vectorcraft
            donor_ref: fe4edb452be5ab7f9b0059aeed81a0a842111f4b
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      APP: ${{ matrix.app }}
      APP_TAG: ${{ matrix.tag }}
      UPSTREAM_REPO: ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: local
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.donor }}
          ref: ${{ matrix.donor_ref }}
          path: donor
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.app == 'vectorcraft'
        with:
          repository: storytold/craft-fonts
          ref: a71c20e30af613287c504f7e685ca8fad77752bc
          path: craft-fonts
          persist-credentials: false
      - name: Integrate Chinese and existing deployment fixes
        run: |
          if [ "$APP" = solidcraft ]; then
            mkdir -p local-font-input
            font_base=https://raw.githubusercontent.com/aosp-mirror/platform_frameworks_base/1aed5ea2dcf7cb0bf35635f378b2326461ba0df0/data/fonts
            curl --fail --location --retry 3 "$font_base/DroidSansFallbackFull.ttf" -o local-font-input/DroidSansFallbackFull.ttf
            curl --fail --location --retry 3 "$font_base/NOTICE" -o local-font-input/NOTICE
            python3 local/deployment/patch-solidcraft-chinese-20261030.py upstream
          else
            python3 local/deployment/upgrade-web-20261030.py "$APP" upstream donor
            python3 local/deployment/fix-vector-font-readiness.py upstream
          fi
          mkdir -p artifacts
          cd upstream
          git add -N .
          git diff --binary > ../artifacts/source.patch
          printf 'Upstream: %s\nTag: %s\nUpstream commit: %s\nBuild commit: %s\n' "$UPSTREAM_REPO" "$APP_TAG" "$(git rev-parse HEAD)" "$GITHUB_SHA" > ../artifacts/SOURCE.txt
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev clang cmake
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          if [ "$APP" = filmcraft ]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked
          else
            curl --fail --location --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz -o /tmp/trunk.tar.gz
            tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: upstream
          key: deployment-web-20261026-${{ matrix.app }}
      - name: Compile Web on GitHub
        run: |
          if [ "$APP" = filmcraft ]; then
            cd upstream
            cargo xtask web
          else
            cd "upstream/apps/$APP-web"
            trunk build --release --locked
          fi
      - name: Package complete Web site
        run: |
          site=upstream/dist/web
          if [ "$APP" = filmcraft ]; then site=upstream/target/web/dist; fi
          test -s "$site/index.html"
          if [ "$APP" = vectorcraft ]; then python3 "$GITHUB_WORKSPACE/local/deployment/package-vector-webfonts.py" upstream "$site" craft-fonts; fi
          cp local-font-input/NOTICE "$site/NOTICE-DroidSansFallback.txt"
          cp upstream/LICENSE* "$site/" 2>/dev/null || true
          if [ -f upstream/deployment-font-source.json ]; then cp upstream/deployment-font-source.json "$site/font-source.json"; fi
          cp artifacts/SOURCE.txt "$site/DEPLOYMENT-SOURCE.txt"
          archive="$GITHUB_WORKSPACE/artifacts/$APP-web-$APP_TAG-zh.zip"
          (cd "$site" && zip -qr3 "$archive" .)
      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-font-readiness-20261030
          path: artifacts/
          retention-days: 30
